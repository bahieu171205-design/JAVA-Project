# Hồ sơ phát triển: thuận tiện khi chạy bằng Eclipse/VS Code với database DocuLib mới.
spring.datasource.url=${DB_URL:jdbc:mysql://localhost:3306/doculib_library?createDatabaseIfNotExist=true&useUnicode=true&characterEncoding=UTF-8&serverTimezone=Asia/Ho_Chi_Minh}
spring.datasource.username=${DB_USERNAME:doculib_user}
spring.datasource.password=${DB_PASSWORD:doculib_password}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# Database doculib_library là database mới, vì vậy Flyway được bật mặc định để
# tạo schema V1 và áp dụng các nâng cấp tiếp theo theo đúng thứ tự.
spring.jpa.hibernate.ddl-auto=validate
spring.flyway.enabled=${FLYWAY_ENABLED:true}
spring.flyway.baseline-on-migrate=false

spring.thymeleaf.cache=false
app.open-browser=${OPEN_BROWSER:true}
app.seed-data=${APP_SEED_DATA:true}
app.security.seed-default-users=${DOCULIB_SEED_DEFAULT_USERS:true}
app.security.admin-password=${DOCULIB_ADMIN_PASSWORD:Admin@123}
app.security.librarian-password=${DOCULIB_LIBRARIAN_PASSWORD:BienMuc@123}
app.security.viewer-password=${DOCULIB_VIEWER_PASSWORD:BanDoc@123}
