# Chỉ dùng với một database thử nghiệm/bản sao, tuyệt đối không trỏ vào database cá nhân.
spring.datasource.url=${MIGRATION_DB_URL}
spring.datasource.username=${MIGRATION_DB_USERNAME}
spring.datasource.password=${MIGRATION_DB_PASSWORD}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

spring.jpa.hibernate.ddl-auto=validate
spring.flyway.enabled=true
spring.flyway.baseline-on-migrate=false
spring.flyway.validate-migration-naming=true

spring.thymeleaf.cache=true
app.open-browser=false
app.seed-data=false
app.security.seed-default-users=false
