<!DOCTYPE html>
<html lang="vi" xmlns:th="http://www.thymeleaf.org">
<body>
<!-- Centralized Lucide-style icon component. Icons are decorative; accessible names live on their controls. -->
<svg th:fragment="icon(name)" class="app-icon" aria-hidden="true" focusable="false"
     viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"
     stroke-linecap="round" stroke-linejoin="round">
    <th:block th:switch="${name}">
        <th:block th:case="'layout-dashboard'">
            <rect width="7" height="9" x="3" y="3" rx="1"></rect>
            <rect width="7" height="5" x="14" y="3" rx="1"></rect>
            <rect width="7" height="9" x="14" y="12" rx="1"></rect>
            <rect width="7" height="5" x="3" y="16" rx="1"></rect>
        </th:block>
        <th:block th:case="'book-open'">
            <path d="M12 7v14"></path>
            <path d="M3 18a1 1 0 0 1-1-1V5a2 2 0 0 1 2-2h5a3 3 0 0 1 3 3v15a3 3 0 0 0-3-3Z"></path>
            <path d="M21 18a1 1 0 0 0 1-1V5a2 2 0 0 0-2-2h-5a3 3 0 0 0-3 3v15a3 3 0 0 1 3-3Z"></path>
        </th:block>
        <th:block th:case="'history'">
            <path d="M3 12a9 9 0 1 0 9-9 9.75 9.75 0 0 0-6.74 2.74L3 8"></path>
            <path d="M3 3v5h5"></path>
            <path d="M12 7v5l4 2"></path>
        </th:block>
        <th:block th:case="'share-2'">
            <circle cx="18" cy="5" r="3"></circle>
            <circle cx="6" cy="12" r="3"></circle>
            <circle cx="18" cy="19" r="3"></circle>
            <path d="m8.59 13.51 6.83 3.98"></path>
            <path d="m15.41 6.51-6.82 3.98"></path>
        </th:block>
        <th:block th:case="'star'">
            <path d="m12 2 3.09 6.26L22 9.27l-5 4.87 1.18 6.88L12 17.77l-6.18 3.25L7 14.14 2 9.27l6.91-1.01Z"></path>
        </th:block>
        <th:block th:case="'star-filled'">
            <path fill="currentColor" d="m12 2 3.09 6.26L22 9.27l-5 4.87 1.18 6.88L12 17.77l-6.18 3.25L7 14.14 2 9.27l6.91-1.01Z"></path>
        </th:block>
        <th:block th:case="'trash-2'">
            <path d="M3 6h18"></path>
            <path d="M19 6l-1 14H6L5 6"></path>
            <path d="M8 6V4a2 2 0 0 1 2-2h4a2 2 0 0 1 2 2v2"></path>
            <path d="M10 11v5"></path>
            <path d="M14 11v5"></path>
        </th:block>
        <th:block th:case="'trending-up'">
            <path d="m3 17 6-6 4 4 8-8"></path>
            <path d="M14 7h7v7"></path>
        </th:block>
        <th:block th:case="'database'">
            <ellipse cx="12" cy="5" rx="9" ry="3"></ellipse>
            <path d="M3 5v14c0 1.66 4.03 3 9 3s9-1.34 9-3V5"></path>
            <path d="M3 12c0 1.66 4.03 3 9 3s9-1.34 9-3"></path>
        </th:block>
        <th:block th:case="'users-round'">
            <path d="M18 21a8 8 0 0 0-16 0"></path>
            <circle cx="10" cy="8" r="5"></circle>
            <path d="M22 20c0-3.37-2-5.5-4-6.5"></path>
        </th:block>
        <th:block th:case="'search'">
            <circle cx="11" cy="11" r="8"></circle>
            <path d="m21 21-4.3-4.3"></path>
        </th:block>
        <th:block th:case="'menu'">
            <path d="M4 6h16"></path><path d="M4 12h16"></path><path d="M4 18h16"></path>
        </th:block>
        <th:block th:case="'chevron-down'">
            <path d="m6 9 6 6 6-6"></path>
        </th:block>
        <th:block th:case="'chevron-right'">
            <path d="m9 18 6-6-6-6"></path>
        </th:block>
        <th:block th:case="'chevron-left'">
            <path d="m15 18-6-6 6-6"></path>
        </th:block>
        <th:block th:case="'arrow-right'">
            <path d="M5 12h14"></path><path d="m13 6 6 6-6 6"></path>
        </th:block>
        <th:block th:case="'log-out'">
            <path d="M9 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h4"></path>
            <polyline points="16 17 21 12 16 7"></polyline>
            <line x1="21" x2="9" y1="12" y2="12"></line>
        </th:block>
        <th:block th:case="'x'">
            <path d="M18 6 6 18"></path><path d="m6 6 12 12"></path>
        </th:block>
        <th:block th:case="'plus'">
            <path d="M5 12h14"></path><path d="M12 5v14"></path>
        </th:block>
        <th:block th:case="'file-text'">
            <path d="M14.5 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V7.5Z"></path>
            <polyline points="14 2 14 8 20 8"></polyline>
            <path d="M8 13h8"></path><path d="M8 17h8"></path><path d="M8 9h2"></path>
        </th:block>
        <th:block th:case="'circle-check'">
            <circle cx="12" cy="12" r="10"></circle><path d="m9 12 2 2 4-4"></path>
        </th:block>
        <th:block th:case="'clock-3'">
            <circle cx="12" cy="12" r="10"></circle><path d="M12 6v6h4"></path>
        </th:block>
        <th:block th:case="'badge-check'">
            <path d="M3.85 8.62a4 4 0 0 1 4.78-4.77 4 4 0 0 1 6.74 0 4 4 0 0 1 4.78 4.78 4 4 0 0 1 0 6.74 4 4 0 0 1-4.77 4.78 4 4 0 0 1-6.75 0 4 4 0 0 1-4.78-4.77 4 4 0 0 1 0-6.76Z"></path>
            <path d="m9 12 2 2 4-4"></path>
        </th:block>
        <th:block th:case="'clipboard-plus'">
            <rect width="8" height="4" x="8" y="2" rx="1" ry="1"></rect>
            <path d="M16 4h2a2 2 0 0 1 2 2v14a2 2 0 0 1-2 2H6a2 2 0 0 1-2-2V6a2 2 0 0 1 2-2h2"></path>
            <path d="M12 11v6"></path><path d="M9 14h6"></path>
        </th:block>
        <th:block th:case="'pencil'">
            <path d="M12 20h9"></path>
            <path d="M16.5 3.5a2.12 2.12 0 0 1 3 3L7 19l-4 1 1-4Z"></path>
        </th:block>
        <th:block th:case="'ellipsis'">
            <circle cx="5" cy="12" r="1"></circle><circle cx="12" cy="12" r="1"></circle><circle cx="19" cy="12" r="1"></circle>
        </th:block>
        <th:block th:case="'eye'">
            <path d="M2.06 12.35a1 1 0 0 1 0-.7C4.32 6.68 7.72 4 12 4s7.68 2.68 9.94 7.65a1 1 0 0 1 0 .7C19.68 17.32 16.28 20 12 20s-7.68-2.68-9.94-7.65Z"></path>
            <circle cx="12" cy="12" r="3"></circle>
        </th:block>
        <th:block th:case="'info'">
            <circle cx="12" cy="12" r="10"></circle><path d="M12 16v-4"></path><path d="M12 8h.01"></path>
        </th:block>
        <th:block th:case="'circle-alert'">
            <circle cx="12" cy="12" r="10"></circle><path d="M12 8v4"></path><path d="M12 16h.01"></path>
        </th:block>
        <th:block th:case="'lock-keyhole'">
            <circle cx="12" cy="16" r="1"></circle>
            <rect width="18" height="12" x="3" y="10" rx="2"></rect>
            <path d="M7 10V7a5 5 0 0 1 10 0v3"></path>
        </th:block>
        <th:block th:case="'circle-slash'">
            <circle cx="12" cy="12" r="10"></circle><path d="m9 15 6-6"></path>
        </th:block>
        <th:block th:case="'archive'">
            <rect width="20" height="5" x="2" y="3" rx="1"></rect>
            <path d="M4 8v11a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8"></path><path d="M10 12h4"></path>
        </th:block>
        <th:block th:case="'shield-alert'">
            <path d="M20 13c0 5-3.5 7.5-8 9-4.5-1.5-8-4-8-9V5l8-3 8 3Z"></path>
            <path d="M12 8v4"></path><path d="M12 16h.01"></path>
        </th:block>
    </th:block>
</svg>
</body>
</html>
