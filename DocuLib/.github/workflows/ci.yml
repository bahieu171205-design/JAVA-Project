name: Java verify

on:
  push:
    branches: ["main", "master"]
  pull_request:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Lấy mã nguồn
        uses: actions/checkout@v4

      - name: Cài Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
          cache: maven

      - name: Kiểm tra dự án
        run: ./mvnw --batch-mode --no-transfer-progress verify
